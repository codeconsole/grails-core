plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
}

version = '0.1'
group = 'legacycommands'

apply plugin: 'groovy'
apply plugin: 'org.apache.grails.gradle.grails-web'

// Standalone Grails 7 / Groovy 4 fixture build (not part of the monorepo dependency graph).
def legacyG7FixtureDir = rootProject.layout.projectDirectory.dir('grails-test-examples/legacy-g7-command-plugin')
def legacyG7FixtureJar = legacyG7FixtureDir.file('build/libs/legacy-g7-command-plugin-0.0.1.jar')
tasks.register('buildLegacyG7CommandFixture', GradleBuild) {
    dir = legacyG7FixtureDir.asFile
    tasks = ['clean', 'jar']
}

dependencies {
    implementation platform(project(':grails-bom'))

    implementation project(':grails-test-examples-legacy-commands-plugin')
    // Real Grails 7.0.10 / Groovy 4.0.30 precompiled ApplicationCommand binary.
    implementation files(legacyG7FixtureJar) {
        builtBy tasks.named('buildLegacyG7CommandFixture')
    }
    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails:grails-logging'
    implementation 'org.apache.grails:grails-databinding'
    implementation 'org.apache.grails:grails-interceptors'
    implementation 'org.apache.grails:grails-services'
    implementation 'org.apache.grails:grails-url-mappings'
    implementation 'org.apache.grails:grails-web-boot'
    if (System.getenv('SITEMESH2_TESTING_ENABLED') == 'true') {
        implementation 'org.apache.grails:grails-layout'
    }
    else {
        implementation 'org.apache.grails:grails-sitemesh3'
    }
    implementation 'org.apache.grails:grails-data-hibernate5'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.apache.tomcat:tomcat-jdbc'

    testImplementation 'org.apache.grails:grails-testing-support-web'
    testImplementation 'org.spockframework:spock-core'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/functional-test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
}

// Opt in to the Grails 7 application-command bridge (off by default on Grails 8).
grails {
    legacyCommandSupport = true
}
