// Standalone composite-build fixture compiled against published Grails 7.0.10 / Groovy 4.0.30.
// Included by the monorepo root so grails-test-examples-legacy-commands can consume a real
// precompiled Grails 7 ApplicationCommand binary instead of recompiling sources under Grails 8.
plugins {
    id 'java-library'
    id 'groovy'
}

group = 'legacy.g7.commands'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.apache.grails:grails-bom:7.0.10')
    implementation 'org.apache.groovy:groovy'
    compileOnly 'org.apache.grails:grails-core'
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Grails-Legacy-Command-Fixture': 'true',
                'Grails-Compile-Version': '7.0.10',
                'Groovy-Compile-Version': '4.0.30'
        )
    }
}
