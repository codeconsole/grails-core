// JMH benchmarks for the Grails HTTP request-processing hot path.
//
// This module is deliberately NOT part of the normal `build` / `check` lifecycle: the
// benchmarks live in their own `jmh` source set, and the only way to run them is the
// explicit `jmh` task. It is also not published (no publish/sbom plugins are applied)
// and it is not subject to the code-analysis gate, since benchmark bodies routinely
// break the rules those tools enforce (dead stores, unused results, empty methods).
//
//   ./gradlew :grails-web-benchmarks:jmh
//   ./gradlew :grails-web-benchmarks:jmh -PjmhArgs="-wi 1 -i 1 -f 1 GrailsWebRequest"
plugins {
    id 'groovy'
    id 'org.apache.grails.buildsrc.properties'
}

version = projectVersion
group = 'org.apache.grails.web'

sourceSets {
    jmh {
        java.srcDir 'src/jmh/java'
        groovy.srcDir 'src/jmh/groovy'
        resources.srcDir 'src/jmh/resources'
    }
}

dependencies {

    jmhImplementation platform(project(':grails-bom'))

    // The classes under measurement
    jmhImplementation project(':grails-core')
    jmhImplementation project(':grails-web-common')
    jmhImplementation project(':grails-web-core')
    jmhImplementation project(':grails-web-url-mappings')

    jmhImplementation 'org.apache.groovy:groovy'
    jmhImplementation 'jakarta.servlet:jakarta.servlet-api'
    jmhImplementation 'org.springframework:spring-beans'
    jmhImplementation 'org.springframework:spring-context'
    jmhImplementation 'org.springframework:spring-web'
    jmhImplementation 'org.springframework:spring-webmvc'
    // MockHttpServletRequest / MockHttpServletResponse / MockServletContext, so that no
    // servlet container is needed to exercise the request-processing path.
    jmhImplementation 'org.springframework:spring-test'

    jmhImplementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"

    // Keep framework logging out of the measured region
    jmhRuntimeOnly 'org.slf4j:slf4j-nop'
}

def releaseVersion = javaVersion as Integer

tasks.withType(JavaCompile).configureEach {
    options.release = releaseVersion
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
    groovyOptions.encoding = 'UTF-8'
    groovyOptions.parameters = true
    // The JMH annotation processor only ever has to see src/jmh/java. Letting it run over the
    // Groovy joint-compilation stubs makes it emit a second, conflicting BenchmarkList.
    options.annotationProcessorPath = files()
}

def jmhResultsFile = layout.buildDirectory.file('reports/jmh/results.json')

tasks.register('jmh', JavaExec) {
    group = 'benchmark'
    description = 'Runs the JMH benchmarks for the Grails HTTP request-processing hot path. ' +
            'Pass JMH options with -PjmhArgs="..." (e.g. -PjmhArgs="-wi 1 -i 1 -f 1").'

    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.jmh.runtimeClasspath

    def resultsFile = jmhResultsFile
    def extraArgs = providers.gradleProperty('jmhArgs').getOrElse('')

    // Groovy's metaclass machinery needs the same reflective access the test JVMs are given.
    def forkedJvmArgs = '--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED'

    argumentProviders.add({
        def result = ['-foe', 'true', '-jvmArgsAppend', forkedJvmArgs,
                      '-rf', 'json', '-rff', resultsFile.get().asFile.absolutePath]
        if (extraArgs) {
            result.addAll(extraArgs.trim().split('\\s+') as List)
        }
        result
    } as CommandLineArgumentProvider)

    doFirst {
        resultsFile.get().asFile.parentFile.mkdirs()
    }
}
