plugins {
    id 'org.apache.grails.gradle.grails-app'
}

grails {
    gorm {
        // Left at its default unless the build states one, so the same project covers both cases.
        if (project.hasProperty('idType')) {
            defaultIdType = project.property('idType')
        }
    }
}

tasks.register('inspectGormIdType') {
    doLast {
        // Read back what the compiler worker JVM would actually be started with. This is the wiring
        // under test: the plugin has to attach the provider to compileGroovy for the setting to reach
        // GORM's entity transformation at all.
        def jvmArguments = tasks.named('compileGroovy').get()
                .groovyOptions.forkOptions.jvmArgumentProviders
                .collectMany { it.asArguments().toList() }
        def idTypeArguments = jvmArguments.findAll { it.startsWith('-Dgrails.compile.gorm.default.id.type=') }
        println "GORM_ID_TYPE_ARGS=${idTypeArguments}"
    }
}
