plugins {
    id 'org.apache.grails.gradle.grails-app'
}

dependencies {
    implementation project(':producer')
    runtimeOnly project(':runtime-only-producer')
}

tasks.register('inspectOrder') {
    doLast {
        def gen = tasks.named('generateCompileGroovyGrailsCompilerConfig').get()
        def deps = gen.taskDependencies.getDependencies(gen)*.path
        println "GENERATOR_DEPENDS_ON_PRODUCER_JAR=${deps.any { it == ':producer:jar' }}"
        // The generator reads the compile classpath, so it must not drag the runtime classpath in.
        println "GENERATOR_DEPENDS_ON_RUNTIME_ONLY_JAR=${deps.any { it == ':runtime-only-producer:jar' }}"
        println "GENERATOR_DECLARED_INPUT_FILES=${gen.inputs.files.files.size()}"
    }
}
