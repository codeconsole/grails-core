tasks.register('inspectGormIdType') {
    doLast {
        ['plugin', 'app'].each { projectName ->
            def compileGroovy = project(":$projectName").tasks.named('compileGroovy').get()
            def arguments = compileGroovy.groovyOptions.forkOptions.jvmArgumentProviders
                    .collectMany { it.asArguments().toList() }
                    .findAll { it.startsWith('-Dgrails.compile.gorm.default.id.type=') }
            println "${projectName.toUpperCase()}_GORM_ID_TYPE_ARGS=${arguments}"
        }
    }
}
