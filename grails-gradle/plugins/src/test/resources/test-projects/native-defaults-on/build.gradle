plugins {
    id 'org.apache.grails.gradle.grails-app'
    id 'org.graalvm.buildtools.native' version '1.1.7'
}

tasks.register('inspectDefaults') {
    doLast {
        def args = project.extensions.getByName('graalvmNative').binaries.getByName('main').buildArgs.get()
        println "INDY=${project.extensions.getByName('grails').indy.get()}"
        println "HAS_ASSETS=${args.contains('-H:IncludeResources=assets/.*')}"
        println "HAS_PROPERTIES=${args.contains('-H:IncludeResources=.*[.]properties')}"
    }
}
