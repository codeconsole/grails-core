plugins {
    id 'groovy'
    id 'java-library'
    id 'project-report'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

dependencies {
    implementation platform(project(':grails-bom'))

    implementation 'io.micrometer:micrometer-observation'
    api project(':grails-web-common')
    api 'org.apache.groovy:groovy'

    // Provided by the container at runtime, but ConvertersExtension is a Groovy extension module
    // whose getJSON/getXML signatures take HttpServletRequest, and the Groovy compiler loads every
    // extension module it finds on a compile classpath before compiling anything. A consumer that
    // depends on this module without a web starter (a plugin, a library) otherwise fails compileGroovy
    // with "Unable to configure org.grails.web.converters.ConvertersExtension due to missing dependency
    // jakarta/servlet/http/HttpServletRequest". Same declaration as grails-controllers and
    // grails-web-taglib.
    compileOnlyApi 'jakarta.servlet:jakarta.servlet-api'

    implementation 'org.apache.commons:commons-lang3'
    implementation project(':grails-datamapping-core')

    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation project(':grails-datastore-core')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.springframework:spring-context'
    testImplementation project(':grails-core')
    testImplementation project(':grails-web-common')

    compileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-test'

    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // Logging
    api 'org.slf4j:slf4j-api'
    api 'org.slf4j:jcl-over-slf4j'

    // Testing
    testImplementation 'org.slf4j:slf4j-simple'
    testImplementation 'org.spockframework:spock-core'

    testRuntimeOnly 'net.bytebuddy:byte-buddy' // Required by Spock's mocking support
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
